
services:
  # ========== MySQL 数据库 ==========
  mysql:
    image: mysql:8.0
    container_name: ai-wealth-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: my_bill_db
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      timeout: 10s
      retries: 5
    networks:
      - ai-wealth-network

  # ========== Redis 缓存 ==========
  redis:
    image: redis:7.0-alpine
    container_name: ai-wealth-redis
    restart: unless-stopped
    ports:
      # 宿主机 6379 常被其他项目（如 aurablog）占用；容器间仍用服务名 redis:6379
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5
    networks:
      - ai-wealth-network

  # ========== 后端服务（你的 Docker Hub 镜像） ==========
  backend:
    build: .                    # 👈 新增这一行，告诉 Compose 从当前目录的 Dockerfile 构建
    image: lossn/ai-wealth-backend:latest
    container_name: ai-wealth-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:                                 # 👈 新增挂载
      - ./:/app                              # 将当前目录（项目根）挂载到容器的 /app
    environment:
      # ===== 以下为必填环境变量 =====
      - ZHIPUAI_API_KEY=${ZHIPUAI_API_KEY}        # 从宿主 .env 读取
      - CHAT_MODEL=${CHAT_MODEL:-glm-4-flash-250414}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-embedding-2}
      - JWT_SECRET_KEY=DOCKER_SECRET_KEY_2026   # 👈 改成和本地默认不一样的值
      # ===== 以下覆盖容器内默认连接地址（容器内用服务名访问） =====
      - DATABASE_URL=mysql+pymysql://root:123456@mysql:3306/my_bill_db?charset=utf8mb4
      - REDIS_HOST=redis
      # ===== 可选：前端跨域配置 =====
      - ALLOW_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,https://your-frontend.vercel.app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-wealth-network

# ========== 持久化卷 ==========
volumes:
  mysql_data:

# ========== 网络 ==========
networks:
  ai-wealth-network:
    driver: bridge